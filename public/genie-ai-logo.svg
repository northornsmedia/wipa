<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Genie AI Icon (Purple stylized lamp/spark) -->
  <g transform="translate(10, 8)">
    <defs>
      <linearGradient id="genieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8B5CF6" />
        <stop offset="50%" stop-color="#673AB7" />
        <stop offset="100%" stop-color="#4C1D95" />
      </linearGradient>
      <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F472B6" />
        <stop offset="100%" stop-color="#A855F7" />
      </linearGradient>
    </defs>
    
    <!-- Outer rounded badge -->
    <rect width="44" height="44" rx="12" fill="url(#genieGrad)" />
    
    <!-- Spark / Genie AI mark inside -->
    <path d="M22 10C22 17 29 22 29 22C29 22 22 27 22 34C22 27 15 22 15 22C15 22 22 17 22 10Z" fill="white" />
    <circle cx="31" cy="13" r="3" fill="url(#sparkGrad)" />
    <circle cx="13" cy="31" r="2" fill="#E9D5FF" />
  </g>
  
  <!-- Text: Genie AI -->
  <text x="66" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#673AB7" letter-spacing="-0.5">Genie</text>
  <text x="140" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#9333EA" letter-spacing="-0.5">AI</text>
</svg>
